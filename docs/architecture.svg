<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Frontier Proxy architecture</title>
  <desc id="desc">The desktop UI sends tasks through a secure bridge into the scheduler and router, which launch local Codex, Claude Code, Codex with Ollama, or Ollama processes.</desc>
  <rect width="960" height="300" rx="16" fill="#0c0f0d"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="30" y="88" width="145" height="124" rx="12" fill="#151a17" stroke="#39423b"/>
    <text x="102" y="135" fill="#a9ef72" text-anchor="middle" font-size="13" font-weight="700">DESKTOP UI</text>
    <text x="102" y="160" fill="#93a097" text-anchor="middle" font-size="11">tasks · output</text>
    <text x="102" y="178" fill="#93a097" text-anchor="middle" font-size="11">providers · limits</text>

    <path d="M175 150H245" stroke="#6c776f" stroke-width="2"/>
    <path d="M235 144L245 150L235 156" fill="none" stroke="#6c776f" stroke-width="2"/>
    <text x="210" y="137" fill="#69736c" text-anchor="middle" font-size="9">SECURE IPC</text>

    <rect x="245" y="55" width="245" height="190" rx="12" fill="#151a17" stroke="#556158"/>
    <text x="367" y="92" fill="#edf1ed" text-anchor="middle" font-family="Georgia,serif" font-size="19">Orchestration core</text>
    <rect x="270" y="113" width="195" height="34" rx="7" fill="#1c241e" stroke="#2f4735"/>
    <text x="367" y="134" fill="#a9ef72" text-anchor="middle" font-size="11">CLASSIFY + SCORE</text>
    <rect x="270" y="157" width="195" height="34" rx="7" fill="#191d1a" stroke="#323a34"/>
    <text x="367" y="178" fill="#c3cbc5" text-anchor="middle" font-size="11">QUEUE + CONCURRENCY</text>
    <rect x="270" y="201" width="195" height="24" rx="7" fill="#191d1a" stroke="#323a34"/>
    <text x="367" y="217" fill="#879188" text-anchor="middle" font-size="9">USAGE · COOLDOWN · FAILOVER</text>

    <path d="M490 150H555" stroke="#6c776f" stroke-width="2"/>
    <path d="M545 144L555 150L545 156" fill="none" stroke="#6c776f" stroke-width="2"/>
    <text x="522" y="137" fill="#69736c" text-anchor="middle" font-size="9">STDIN / JSONL</text>

    <g font-size="12" text-anchor="middle">
      <rect x="555" y="30" width="170" height="47" rx="9" fill="#151a17" stroke="#3a433c"/><text x="640" y="59" fill="#edf1ed">Codex CLI</text>
      <rect x="755" y="30" width="170" height="47" rx="9" fill="#151a17" stroke="#3a433c"/><text x="840" y="59" fill="#edf1ed">Claude Code</text>
      <rect x="555" y="100" width="170" height="47" rx="9" fill="#172018" stroke="#3d5a42"/><text x="640" y="129" fill="#a9ef72">Codex + Ollama</text>
      <rect x="755" y="100" width="170" height="47" rx="9" fill="#172018" stroke="#3d5a42"/><text x="840" y="129" fill="#a9ef72">Ollama</text>
      <rect x="655" y="170" width="170" height="47" rx="9" fill="#151a17" stroke="#3a433c"/><text x="740" y="199" fill="#edf1ed">Custom local CLI</text>
    </g>
    <text x="740" y="250" fill="#69736c" text-anchor="middle" font-size="10" letter-spacing="1">NO MODEL API KEYS · NO SHELL INTERPOLATION</text>
  </g>
</svg>
