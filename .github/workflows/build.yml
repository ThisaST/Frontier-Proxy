name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: pnpm exec electron-builder --win --x64 --publish never
            artifact: Frontier-Proxy-Windows-x64
            cache: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
            files: |
              release/*.exe
          - name: macOS
            os: macos-14
            command: pnpm exec electron-builder --mac --x64 --publish never
            artifact: Frontier-Proxy-macOS-x64
            cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
            files: |
              release/*.dmg
              release/*.zip
          - name: Linux
            os: ubuntu-latest
            command: pnpm exec electron-builder --linux --x64 --publish never
            artifact: Frontier-Proxy-Linux-x64
            cache: |
              ~/.cache/electron
              ~/.cache/electron-builder
            files: |
              release/*.AppImage
              release/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Restore Electron download cache
        uses: actions/cache@v5
        with:
          path: ${{ matrix.cache }}
          key: electron-${{ runner.os }}-x64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-x64-

      - name: Build application
        run: pnpm build

      - name: Package application
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ${{ matrix.command }}; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "Packaging attempt $attempt failed; retrying in 20 seconds..."
            sleep 20
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5

      - name: Download packaged applications
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts

      - name: Check for an existing release
        id: existing-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}"

      - name: Create release
        if: steps.existing-release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/**/* --generate-notes --verify-tag

      - name: Update release assets
        if: steps.existing-release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-artifacts/**/* --clobber
