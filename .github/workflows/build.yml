name: Build desktop apps

# Pushes to main reach this workflow through release.yml, which passes
# `release-tag` when the version in package.json has not been released yet.
# Pushing a v* tag by hand still builds and publishes that tag.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Tag to create and publish (e.g. v0.9.4). Empty builds without releasing.
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A newer build supersedes an unfinished one, except a release build: cancelling
# that would leave a version with no installers.
concurrency:
  group: desktop-build-${{ github.ref }}-${{ inputs.release-tag }}
  cancel-in-progress: ${{ !inputs.release-tag }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: pnpm exec electron-builder --win --x64 --publish never
            artifact: Frontier-Proxy-Windows-x64
            cache: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
            files: |
              release/*.exe
          - name: macOS
            os: macos-14
            command: pnpm exec electron-builder --mac --x64 --publish never
            artifact: Frontier-Proxy-macOS-x64
            cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
            files: |
              release/*.dmg
              release/*.zip
          - name: Linux
            os: ubuntu-latest
            command: pnpm exec electron-builder --linux --x64 --publish never
            artifact: Frontier-Proxy-Linux-x64
            cache: |
              ~/.cache/electron
              ~/.cache/electron-builder
            files: |
              release/*.AppImage
              release/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Restore Electron download cache
        uses: actions/cache@v5
        with:
          path: ${{ matrix.cache }}
          key: electron-${{ runner.os }}-x64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-x64-

      - name: Build application
        run: pnpm build

      - name: Package application
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ${{ matrix.command }}; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "Packaging attempt $attempt failed; retrying in 20 seconds..."
            sleep 20
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: inputs.release-tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release-tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download packaged applications
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts

      # The release notes are this version's CHANGELOG.md section, written by
      # the release PR. A hand-pushed tag with no section falls back to
      # GitHub's generated notes.
      - name: Extract release notes
        id: notes
        run: |
          version="${TAG#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > release-notes.md
          else
            : > release-notes.md
          fi
          if [ -s release-notes.md ] && grep -q '[^[:space:]]' release-notes.md; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "source=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing release
        id: existing-release
        continue-on-error: true
        run: gh release view "$TAG"

      # --target creates the tag on this exact commit when it does not exist
      # yet (the release.yml path); a hand-pushed tag already exists.
      - name: Create release
        if: steps.existing-release.outcome == 'failure'
        run: |
          if [ "${{ steps.notes.outputs.source }}" = "changelog" ]; then
            gh release create "$TAG" release-artifacts/**/* --target "$GITHUB_SHA" --title "Release $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" release-artifacts/**/* --target "$GITHUB_SHA" --title "Release $TAG" --generate-notes
          fi

      - name: Update release assets
        if: steps.existing-release.outcome == 'success'
        run: gh release upload "$TAG" release-artifacts/**/* --clobber
